# CI della knowledge base: a ogni pull request e a ogni push su main controlla che gli script, i Dockerfile e i link siano a posto
# e che tutti i laboratori partano davvero. Guida: 11-container-e-automazione/13-github-actions/github-actions.md
name: KB

on:
  push:
    branches: [main]                   # sui rami di lavoro basta la pull_request: con tutti e due ogni push partiva due volte
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                             # un push nuovo sullo stesso ramo annulla il controllo ancora in corso
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  HADOLINT: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Script dei laboratori e dell'area 11
        run: |
          # gli esercizi di 05-scripting e gli script di zz-esempi/esercizi e zz-esempi/rubrica restano fuori: sono esempi
          # da studiare (la loro prova è verifica.sh, nel laboratorio di zz-esempi, che invece è controllato)
          git ls-files '*.sh' | grep -vE '^(05-scripting/[^/]+\.sh|zz-esempi/(esercizi|rubrica)/)' > script.txt
          echo "$(wc -l < script.txt) script"
          echo "::add-matcher::.github/shellcheck-matcher.json"    # le righe di shellcheck diventano annotazioni
          xargs -a script.txt docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK" --format gcc --severity warning

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write             # per caricare il report nella scheda Security > Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tutti i Dockerfile
        run: |
          git ls-files | grep -E '(^|/)Dockerfile$' > dockerfile.txt
          echo "$(wc -l < dockerfile.txt) Dockerfile"
          # report SARIF con tutto (anche warning e info), poi il controllo che blocca da warning in su (come nel resto della KB)
          xargs -a dockerfile.txt docker run --rm -v "$PWD:/mnt" -w /mnt "$HADOLINT" hadolint --format sarif --no-fail > hadolint.sarif
          xargs -a dockerfile.txt docker run --rm -v "$PWD:/mnt" -w /mnt "$HADOLINT" hadolint --failure-threshold warning
      - name: Report nella scheda Security
        if: always() && github.event_name != 'pull_request'    # da una PR di un fork il token non può scrivere
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/controlla-link.py

  laboratori:
    name: laboratorio ${{ matrix.area }}
    needs: shellcheck                    # inutile costruire le immagini se gli script hanno errori
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false                   # un laboratorio rotto non deve nascondere gli altri
      matrix:
        area: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "12", "zz-esempi"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ./lab.sh ${{ matrix.area }}
        env:
          AREA: ${{ matrix.area }}
        run: |
          # lo stesso comando di chi studia: costruisce le immagini, avvia i servizi, lancia prepara.sh,
          # esegue un comando nel laboratorio ed esce (e spegne tutto)
          ./lab.sh "$AREA" -- 'echo "laboratorio pronto in $PWD"; ls; echo "$(find . -type f | wc -l) file"'
      - name: Autotest degli esercizi e degli scenari (aree 02, 03, 04, 05, 06, 07, 08, 09, 10 e 12)
        if: contains(fromJSON('["02","03","04","05","06","07","08","09","10","12"]'), matrix.area)
        env:
          AREA: ${{ matrix.area }}
        run: |
          # come risposta si dà a ogni esercizio la sua stessa soluzione di riferimento: verifica.sh deve dire OK a tutti,
          # altrimenti è rotto il verificatore (o la palestra), non lo studente
          case $AREA in
              02) dir=10-esercizi n=20 risposta='bash /kb/02-file-e-permessi/lab/soluzioni.sh %d' ;;
              03) dir=06-esercizi n=18 risposta='bash /kb/03-testo-e-regex/lab/soluzioni.sh %d' ;;
              # in 04 gli esercizi agiscono su processi vivi (lo scenario di scenario.sh) e uno è uno script che si avvia da solo
              04) ./lab.sh 04 -- 'cd 06-esercizi && bash /kb/04-processi/lab/autotest.sh'; exit ;;
              # in 06 gli esercizi cambiano il sistema vero del container (systemd): utenti, unit, mount, crontab
              06) ./lab.sh 06 -- 'cd 13-esercizi && bash /kb/06-sistema/lab/autotest.sh'; exit ;;
              # in 07 non ci sono esercizi, ma scenari guidati: si rompe e si ripara ogni guasto del dominio Active Directory
              07) ./lab.sh 07 -- 'bash /kb/07-windows/lab/scenari-autotest.sh'; exit ;;
              # in 08 gli esercizi usano i tre server veri (ssh con agente, tunnel, ufw) e il GPG/WireGuard del client; poi si rompe e si ripara ogni scenario guidato
              08) ./lab.sh 08 -- 'cd 06-esercizi && bash /kb/08-remoto-e-sicurezza/lab/autotest.sh && bash /kb/08-remoto-e-sicurezza/lab/scenari-autotest.sh'; exit ;;
              # in 09 non ci sono esercizi, ma scenari guidati: si rompe e si ripara ogni guasto (curl, MySQL, git, RabbitMQ, Kafka)
              09) ./lab.sh 09 -- 'bash /kb/09-strumenti/lab/scenari-autotest.sh'; exit ;;
              # in 12 non ci sono esercizi, ma scenari guidati: si rompe e si ripara ogni guasto del monitoraggio (controlli dal vero: Mailpit, Loki, Grafana)
              12) ./lab.sh 12 -- 'bash /kb/12-osservabilita/lab/scenari-autotest.sh'; exit ;;
              # in 10 gli esercizi cambiano la rete del container host (indirizzi, rotte, namespace, nginx); poi si rompe e si ripara ogni scenario guidato
              10) ./lab.sh 10 -- 'cd 10-esercizi && bash /kb/10-rete-e-web/lab/autotest.sh && bash /kb/10-rete-e-web/lab/scenari-autotest.sh'; exit ;;
              # in 05 la risposta è uno script che riceve argomenti e stdin: ci pensa autotest.sh
              05) ./lab.sh 05 -- 'cd 13-esercizi && bash /kb/05-scripting/lab/autotest.sh'; exit ;;
          esac
          ./lab.sh "$AREA" -- "cd $dir && for i in \$(seq 1 $n); do printf '$risposta\n' \$i > risposte/\$(printf %02d \$i).sh; done; ./verifica.sh"
      - name: verifica.sh (solo zz-esempi)
        if: matrix.area == 'zz-esempi'
        run: ./lab.sh zz-esempi -- 'cd esercizi && ./verifica.sh'      # 31 casi sugli script: esce con 1 se uno è ERRATO
