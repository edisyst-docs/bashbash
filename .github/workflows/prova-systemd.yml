# TEMPORANEO: confronta i modi di avviare systemd in un container sul runner GitHub. Da togliere.
name: prova systemd
on:
  push:
    paths: [.github/workflows/prova-systemd.yml]
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          stat -fc %T /sys/fs/cgroup; docker info --format 'cgroup {{.CgroupVersion}} {{.CgroupDriver}}'; ps -p 1 -o comm=
          docker build -q --target systemd -t bashbash-systemd .
      - name: A - attuale (bind del cgroup dell'host)
        run: |
          docker run -d --name a --cgroupns=private --cap-add SYS_ADMIN --tmpfs /run --tmpfs /run/lock \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw bashbash-systemd; sleep 10
          docker ps -a --filter name=a --format '{{.Status}}'; docker logs a 2>&1 | tail -15
      - name: B - cgroup privato rimontato
        run: |
          docker run -d --name b --cgroupns=private --cap-add SYS_ADMIN --tmpfs /run --tmpfs /run/lock \
              --entrypoint sh bashbash-systemd -c 'mount -o remount,rw /sys/fs/cgroup && exec /sbin/init'; sleep 10
          docker ps -a --filter name=b --format '{{.Status}}'; docker logs b 2>&1 | tail -8
          docker exec b systemctl is-system-running || true
      - name: C - come B, AppArmor unconfined
        run: |
          docker run -d --name c --cgroupns=private --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
              --tmpfs /run --tmpfs /run/lock \
              --entrypoint sh bashbash-systemd -c 'mount -o remount,rw /sys/fs/cgroup && exec /sbin/init'; sleep 10
          docker ps -a --filter name=c --format '{{.Status}}'; docker logs c 2>&1 | tail -8
          docker exec c systemctl is-system-running || true
          docker exec c systemctl is-active ssh nginx || true
