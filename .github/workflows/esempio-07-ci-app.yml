# Esempio 07: la CI completa dell'app Flask, come la pipeline 07-ci-app di Jenkins e GitLab.
#   lint (Hadolint) ─┐
#   test (pytest) ───┴── immagine: build, Trivy (blocca i CRITICAL), push su GHCR solo se richiesto
# Guida: 11-container-e-automazione/13-github-actions/github-actions.md
name: "Esempio 07: CI dell'app"

on:
  push:
    paths:
      - .github/workflows/esempio-07-ci-app.yml
      - 11-container-e-automazione/13-github-actions/app/**
  pull_request:
    paths: [11-container-e-automazione/13-github-actions/app/**]
  workflow_dispatch:
    inputs:
      pubblica:
        description: Pubblica l'immagine su ghcr.io (solo dal ramo main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:                             # un push nuovo sullo stesso ramo annulla l'esecuzione ancora in corso
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: 11-container-e-automazione/13-github-actions/app
  IMMAGINE: ghcr.io/${{ github.repository }}/esempio-app      # ghcr.io/proprietario/repo/esempio-app
  # versione e digest fissi: a marzo 2026 sono state pubblicate immagini Trivy compromesse con tag "normali"
  TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  HADOLINT: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -i "$HADOLINT" hadolint --failure-threshold warning - < "$APP/Dockerfile"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.APP }}/requirements.txt
      - run: pip install --quiet -r "$APP/requirements.txt" pytest
      - run: cd "$APP" && pytest -q

  immagine:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write                    # solo questo job può pubblicare su ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Etichette e tag dell'immagine
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMMAGINE }}
          tags: |
            type=sha
            type=ref,event=branch
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (nel demone Docker del runner, per la scansione)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP }}
          load: true                     # l'immagine finisce in "docker images": Trivy la legge da lì
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha           # cache dei layer nella cache di GitHub Actions
          cache-to: type=gha,mode=max
      - name: Trivy
        env:
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}   # uno dei tag (tutti in minuscolo, come vuole ghcr.io)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet \
              --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed "$TAG" | tee trivy.txt
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet \
              --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 "$TAG"
          { echo '### Trivy: HIGH e CRITICAL correggibili'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Login a ghcr.io
        if: inputs.pubblica && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # nessun segreto da creare: il token del workflow, con packages: write
      - name: Push
        if: inputs.pubblica && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}     # uno per riga
        run: for t in $TAGS; do docker push "$t"; done
