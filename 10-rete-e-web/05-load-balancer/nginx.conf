# Nginx come bilanciatore primario: sostituisce l'intero /etc/nginx/nginx.conf del container
events {}

http {
    upstream haproxy_backends {
        server haproxy:80;
        # server haproxy2:80;        # altre istanze secondarie: nginx le usa a turno
    }

    server {
        listen 80;

        location / {
            proxy_pass http://haproxy_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
