# HAProxy primario: riceve il traffico dei client e lo passa agli HAProxy secondari
global
    log stdout format raw local0

resolvers docker                    # come in haproxy.cfg: segue i cambi di IP dei container
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 2
    timeout connect 2s
    timeout client  50s
    timeout server  50s
    default-server check resolvers docker init-addr last,libc,none

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    server haproxy1 haproxy:80
    # con più istanze secondarie basta aggiungerle qui:
    # server haproxy2 haproxy2:80
