# HAProxy primario: riceve il traffico dei client e lo passa agli HAProxy secondari
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    server haproxy1 haproxy:80 check
    # con più istanze secondarie basta aggiungerle qui:
    # server haproxy2 haproxy2:80 check
