# HAProxy secondario: distribuisce le richieste tra i tre web server
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin              # a turno: web1, web2, web3, web1...
    server web1 web1:80 check       # check: HAProxy controlla di continuo che il server risponda e lo esclude se è giù
    server web2 web2:80 check
    server web3 web3:80 check

# pagina di statistiche: http://localhost:8404/stats
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
