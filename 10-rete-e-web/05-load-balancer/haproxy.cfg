# HAProxy secondario: distribuisce le richieste tra i tre web server
global
    log stdout format raw local0

# il DNS interno di Docker: HAProxy lo interroga di continuo, così se un container riparte con un IP diverso
# lo ritrova. Senza questa sezione i nomi si risolvono una volta sola, all'avvio
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    log global
    mode http
    option httplog
    option redispatch               # se la connessione a un server fallisce, ritenta su un ALTRO server...
    retries 2                       # ...fino a 2 volte: durante un guasto il client non vede errori
    timeout connect 2s
    timeout client  50s
    timeout server  50s
    default-server check resolvers docker init-addr last,libc,none # vale per ogni riga "server"
    # init-addr none: HAProxy parte anche se un server non esiste ancora (lo segna DOWN finché non compare)

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin              # a turno: web1, web2, web3, web1...
    server web1 web1:80             # check (da default-server): HAProxy controlla di continuo che il server risponda e lo esclude se è giù
    server web2 web2:80
    server web3 web3:80

# pagina di statistiche: http://localhost:8404/stats
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
