# Un Job esegue un lavoro fino al completamento, invece di tenerlo sempre acceso come un Deployment.
# Qui: 5 blocchi da elaborare, al massimo 2 Pod alla volta; ogni Pod riceve il suo indice (0-4).
apiVersion: batch/v1
kind: Job
metadata:
  name: elabora
spec:
  completions: 5                       # quante esecuzioni riuscite servono per finire
  parallelism: 2                       # quante in contemporanea
  completionMode: Indexed              # ogni Pod ha JOB_COMPLETION_INDEX = 0, 1, 2, 3, 4
  backoffLimit: 2                      # dopo 3 fallimenti in totale il Job è fallito
  ttlSecondsAfterFinished: 600         # 10 minuti dopo la fine Kubernetes cancella Job e Pod
  template:
    spec:
      restartPolicy: Never             # in un Job: Never (nuovo Pod a ogni tentativo) o OnFailure
      containers:
        - name: elabora
          image: bash:5
          command: ["bash", "/script/elabora.sh"]
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: script
