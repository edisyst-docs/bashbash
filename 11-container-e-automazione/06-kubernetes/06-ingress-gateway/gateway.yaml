# Gateway API, il successore di Ingress: ruoli separati e funzioni che Ingress non ha (pesi, header...).
#   Gateway   -> il punto di ingresso (chi lo gestisce: il team della piattaforma)
#   HTTPRoute -> le regole di instradamento (chi le scrive: il team dell'applicazione)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingresso
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 8089                       # con Docker Desktop anche sul PC: localhost:8089
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: colori
spec:
  parentRefs:
    - name: ingresso                   # a quale Gateway si aggancia
  rules:
    - matches:                         # con l'header "X-Versione: verde" va sempre a verde
        - headers:
            - name: X-Versione
              value: verde
      backendRefs:
        - name: verde
          port: 80
    - backendRefs:                     # tutto il resto: rilascio canary, 90% a blu e 10% a verde
        - name: blu
          port: 80
          weight: 90
        - name: verde
          port: 80
          weight: 10
