apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sito.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.service.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "sito.selector" . | nindent 4 }}
  ports:
    - port: 80
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
