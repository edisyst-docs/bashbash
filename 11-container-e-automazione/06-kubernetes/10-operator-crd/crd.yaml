# Insegna a Kubernetes un tipo nuovo: Sito (sinonimo "kubectl get siti"). Il CRD descrive solo la forma dei dati: chi li usa è l'operatore.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siti.lab.example.com               # sempre <plurale>.<gruppo>
spec:
  group: lab.example.com
  scope: Namespaced
  names:
    kind: Sito
    plural: siti
    singular: sito
    shortNames: [st]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}                         # lo "status" si scrive a parte, e un utente che modifica "spec" non lo tocca
      additionalPrinterColumns:            # le colonne di "kubectl get siti"
        - { name: Repliche, type: integer, jsonPath: .spec.repliche }
        - { name: Pronte, type: string, jsonPath: .status.pronte }
        - { name: Titolo, type: string, jsonPath: .spec.titolo }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Cosa si vuole
              required: [titolo]
              properties:
                titolo:
                  description: Il titolo della pagina (lettere, cifre e spazi)
                  type: string
                  pattern: '^[A-Za-z0-9 ]{1,40}$'    # niente virgolette o simboli: finisce in una pagina HTML
                repliche:
                  description: Quanti Pod nginx (da 1 a 5, default 2)
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 2
            status:
              type: object
              properties:
                pronte: { type: string }
