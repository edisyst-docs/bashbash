# Un Secret è come una ConfigMap, ma per dati riservati: Kubernetes lo tratta con più cautela
# (non lo mostra in describe, lo tiene in memoria sui nodi, si può proteggere con RBAC e cifrare in etcd).
# ATTENZIONE: nel file e nell'API il valore è solo codificato in base64, non cifrato. Questo file non va in git
# in un progetto vero: il Secret si crea con kubectl create secret, o con strumenti come Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: sito-secret
type: Opaque
stringData:                            # in chiaro qui: Kubernetes lo salva in base64 nel campo data
  DB_PASSWORD: cambiami
