# WordPress: senza stato proprio (i dati sono nel database), quindi si può replicare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql             # il nome del Service: il DNS del cluster lo risolve
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credenziali
                  key: password
            - name: WORDPRESS_DB_NAME
              value: wordpress
          envFrom:
            - secretRef:
                name: wordpress-chiavi # le stesse chiavi su tutte le repliche
          ports:
            - containerPort: 80
          readinessProbe:              # senza database WordPress risponde 500: la replica esce dal bilanciamento
            httpGet:
              path: /wp-login.php
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - port: 80
      nodePort: 30082                  # http://localhost:30082
