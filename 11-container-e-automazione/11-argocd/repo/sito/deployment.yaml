# Il messaggio sta in una variabile d'ambiente e non nella ConfigMap: cambiarla modifica il template del Pod,
# quindi ogni commit che la tocca produce un rolling update (una ConfigMap cambiata non riavvia nessun Pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sito
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sito
  template:
    metadata:
      labels:
        app: sito
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          env:
            - name: MESSAGGIO
              value: "sito versione 1"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates  # i *.template di qui finiscono, sostituiti, in conf.d
      volumes:
        - name: template
          configMap:
            name: sito-nginx
