# Cluster kind per il laboratorio Argo CD: un control plane e un worker.
#   kind create cluster --config kind-argocd.yaml      -> contesto kubectl "kind-argocd"
#   kind delete cluster --name argocd
# È un cluster separato da quello dei laboratori di ../06-kubernetes/ ("lab"): possono girare insieme.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd
nodes:
  - role: control-plane
    # porte del PC -> NodePort del cluster, solo su 127.0.0.1
    extraPortMappings:
      - { containerPort: 30443, hostPort: 30443, listenAddress: "127.0.0.1" } # Argo CD, interfaccia web e API
      - { containerPort: 30090, hostPort: 30090, listenAddress: "127.0.0.1" } # sito
      - { containerPort: 30091, hostPort: 30091, listenAddress: "127.0.0.1" } # mia-app, ambiente dev
      - { containerPort: 30092, hostPort: 30092, listenAddress: "127.0.0.1" } # mia-app, ambiente prod
      - { containerPort: 30093, hostPort: 30093, listenAddress: "127.0.0.1" } # chart Helm
  - role: worker
