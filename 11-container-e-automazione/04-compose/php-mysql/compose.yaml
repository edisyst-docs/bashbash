# Apache+PHP collegato a MySQL
#   docker compose up -d --build       -> http://localhost:8100
#   docker compose down                (aggiungere -v per cancellare anche il database)
services:
  php-apache:
    build: .                           # immagine costruita dal Dockerfile di questa cartella
    ports:
      - "8100:80"
    volumes:
      - ./:/var/www/html/              # bind mount: le modifiche a index.php si vedono subito
    environment:
      DB_HOST: database
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydatabase
    depends_on:
      database:
        condition: service_healthy     # parte solo quando MySQL risponde davvero, non appena il container è avviato

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase       # creati al primo avvio, solo se il volume è vuoto
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "9100:3306"                    # per collegarsi dal PC (HeidiSQL, DBeaver) su localhost:9100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"] # via TCP: durante l'init MySQL gira senza rete
      interval: 5s
      retries: 20

volumes:
  mysql_data:
