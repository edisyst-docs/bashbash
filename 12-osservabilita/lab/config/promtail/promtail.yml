# promtail.yml - raccoglie i log dal server e li manda a Loki.
# Legge il journal di systemd e i file di log di nginx.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml                  # dove è arrivata la lettura di ogni file

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # journal di systemd: tutti i servizi del server
  - job_name: journal
    journal:
      path: /var/log/journal                     # montato dal server via volume condiviso
      labels:
        job: journal
        host: server
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
      - source_labels: [__journal_priority_keyword]
        target_label: priority

  # access log di nginx: una riga per richiesta
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          host: server
          tipo: access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) - \S+ \[(?P<ts>[^\]]+)\] "(?P<metodo>\S+) (?P<percorso>\S+) \S+" (?P<stato>\d{3}) (?P<bytes>\d+)'
      - labels:
          metodo:
          stato:
      - timestamp:
          source: ts
          format: "02/Jan/2006:15:04:05 -0700"

  # error log di nginx
  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          host: server
          tipo: error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[(?P<livello>\w+)\]'
      - labels:
          livello:
